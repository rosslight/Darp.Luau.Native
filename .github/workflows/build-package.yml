name: Build and Test Package

on:
  pull_request:
  push:
  workflow_call:

jobs:
  build-native:
    name: Build native (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            generator: Visual Studio 18 2026
          - rid: win-arm64
            runner: windows-latest
            generator: Visual Studio 18 2026
          - rid: linux-x64
            runner: ubuntu-latest
            generator: Ninja
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            generator: Ninja
          - rid: osx-x64
            runner: macos-latest-large
            generator: Ninja
          - rid: osx-arm64
            runner: macos-latest
            generator: Ninja
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native runtime
        shell: pwsh
        run: ./scripts/build_native.ps1 -RuntimeId "${{ matrix.rid }}" -Generator "${{ matrix.generator }}"

      - name: Upload native runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/

  pack:
    name: Pack NuGet
    needs: build-native
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download native runtime artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack NuGet
        run: dotnet pack src/Darp.Luau.Native/Darp.Luau.Native.csproj -c Release -o artifacts/packages

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

  integration-test:
    name: Integration test (${{ matrix.os }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
          - os: windows-arm64
            runner: windows-11-arm
          - os: macos
            runner: macos-latest
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore integration tests with package feed
        shell: pwsh
        run: |
          $source = (Resolve-Path "artifacts/packages").Path
          Write-Host "Package source: $source"
          dotnet restore tests/Darp.Luau.Native.IntegrationTests/Darp.Luau.Native.IntegrationTests.csproj `
            --source "https://api.nuget.org/v3/index.json" `
            --source "$source" `
            -p:UseLocalProjectReference=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run integration tests
        shell: pwsh
        run: |
          dotnet run `
            --project tests/Darp.Luau.Native.IntegrationTests/Darp.Luau.Native.IntegrationTests.csproj `
            -c Release `
            --no-restore `
            -p:UseLocalProjectReference=false
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("Integration tests exited with code {0} (0x{0:X8})" -f $LASTEXITCODE)
            exit $LASTEXITCODE
          }

  # Temporary: isolate MSVC ARM64 state-initialization code generation.
  diagnose-win-arm64:
    name: Diagnose win-arm64 (${{ matrix.name }})
    runs-on: windows-11-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: parent-738
            luau: 47cda63705c25633d757bacdcb7c9c6190625cad
            flags: /O2 /Ob2
            state_options: ""
          - name: baseline-741
            luau: pinned
            flags: /O2 /Ob2
            state_options: ""
          - name: state-Od
            luau: pinned
            flags: /O2 /Ob2
            state_options: /Od;/Ob0
          - name: state-no-vectorization
            luau: pinned
            flags: /O2 /Ob2
            state_options: /Qvec-
          - name: state-no-pre
            luau: pinned
            flags: /O2 /Ob2
            state_options: /d2ssa-pre-
          - name: all-Od
            luau: pinned
            flags: /Od /Ob0
            state_options: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check out Luau ${{ matrix.luau }}
        if: matrix.luau != 'pinned'
        shell: pwsh
        run: |
          git -C native/luau fetch --depth 1 origin "${{ matrix.luau }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C native/luau checkout FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build luau.dll natively with PDB and assembly
        shell: pwsh
        run: |
          cmake -S native -B build -G "Visual Studio 18 2026" -A ARM64 `
            "-DLUAU_ARM64_DIAG_STATE_OPTIONS=${{ matrix.state_options }}" `
            "-DCMAKE_CXX_FLAGS_RELEASE=${{ matrix.flags }} /DNDEBUG /Zi /FAs" `
            "-DCMAKE_SHARED_LINKER_FLAGS_RELEASE=/DEBUG /OPT:REF /OPT:ICF /INCREMENTAL:NO"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --target luau --config Release --parallel -- /v:m /clp:ErrorsOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S .github/diag -B build-repro -G "Visual Studio 18 2026" -A ARM64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-repro --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repro
        shell: pwsh
        continue-on-error: true
        run: |
          ./build-repro/Release/repro.exe (Resolve-Path build/Release/luau.dll).Path
          Write-Host ("repro exited with 0x{0:X8}" -f $LASTEXITCODE)
          exit $LASTEXITCODE

      - name: Upload assembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assembly-${{ matrix.name }}
          path: |
            build/**/lstate.asm
            build/**/lmem.asm
